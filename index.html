<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>fd8 · Robattle</title>
<style>
  :root{ color-scheme:dark; --bg:#111418; --panel:#1b2027; --line:#323a45; --head:#252c35; --text:#e4e8ee; --dim:#8e98a6;
    --p1:#4cc3e0; --p2:#f09a4a; --red:#ff6b6b; --green:#6fd47a; --idle:#3a3520; --guard:#1f3347; }
  body{ font-family:system-ui, sans-serif; margin:0; padding:12px; background:var(--bg); color:var(--text); font-size:14px; }
  h2{ margin:4px 0 8px; font-size:16px; }
  small{ color:var(--dim); }
  button, select, input{ font:inherit; color:var(--text); background:var(--head); border:1px solid var(--line); border-radius:4px; padding:2px 6px; }
  button{ cursor:pointer; } button:hover{ border-color:var(--p1); }
  table{ border-collapse:collapse; }
  td, th{ border:1px solid var(--line); padding:2px 6px; text-align:left; }
  th{ background:var(--head); }
  .num{ text-align:right; font-family:ui-monospace, monospace; }
  .row{ display:flex; gap:12px; flex-wrap:wrap; align-items:flex-start; }
  .box{ background:var(--panel); border:1px solid var(--line); padding:8px; }
  .p1{ color:var(--p1); } .p2{ color:var(--p2); }
  select{ max-width:170px; }
  .hidden{ display:none; }

  /* gauge field: P1 walks right from its base, P2 walks left; the center line is in the middle */
  .field{ position:relative; width:760px; background:var(--panel); border:1px solid var(--line); }
  .lane{ position:relative; height:44px; border-bottom:1px dashed var(--line); }
  .center{ position:absolute; left:50%; top:0; bottom:0; border-left:2px solid var(--red); }
  .marker{ position:absolute; top:6px; width:110px; margin-left:-55px; text-align:center; font-size:12px; padding:2px; border:2px solid; background:var(--head); }
  .marker.p1{ border-color:var(--p1); } .marker.p2{ border-color:var(--p2); }
  .marker.out{ opacity:.35; text-decoration:line-through; }
  .marker.idle{ background:var(--idle); } .marker.guard{ background:var(--guard); }
  .bar{ height:5px; background:var(--line); width:80px; display:inline-block; vertical-align:middle; }
  .bar > div{ height:100%; background:var(--green); }
  .bar.low > div{ background:var(--red); }
  .dead{ color:var(--dim); text-decoration:line-through; }
  .log{ height:260px; overflow-y:auto; width:520px; font-family:ui-monospace, monospace; font-size:12px; white-space:pre-wrap; }
  .act{ font-weight:bold; } .miss{ color:var(--dim); } .crit{ color:var(--red); font-weight:bold; } .out{ color:var(--red); }
  .heal{ color:var(--green); } .order{ color:var(--dim); }
  .cmd button{ display:block; margin:3px 0; text-align:left; width:100%; }
  .cmd{ min-width:330px; min-height:120px; }
  .cmd td button{ width:auto; margin:0; }
</style>
</head>
<body>

<div id="setup">
  <h2>fd8 · Robattle setup <small>(you play both sides; slot 1 is the leader)</small></h2>
  <div class="row">
    <div class="box" id="team0"></div>
    <div class="box" id="team1"></div>
  </div>
  <p>Terrain: <select id="terrain"></select> <button id="startBtn"><b>Start robattle</b></button></p>
  <h2>Parts <small>(numbers are placeholders — edit data.js)</small></h2>
  <div class="box" id="partsTable"></div>
</div>

<div id="battle" class="hidden">
  <h2>Robattle <small id="terrainLabel"></small> <button id="speedBtn">Speed: 1×</button> <button id="quitBtn">Back to setup</button></h2>
  <div class="field" id="field"></div>
  <div class="row" style="margin-top:10px">
    <div class="box cmd" id="cmd"></div>
    <div class="box" id="teamStatus0"></div>
    <div class="box" id="teamStatus1"></div>
  </div>
  <div class="box log" id="log" style="margin-top:10px"></div>
</div>

<script src="data.js"></script>
<script src="game.js"></script>
<script>
(function(){
  var teams = DEFAULT_TEAMS.map(function(t){ return t.map(function(k){ return JSON.parse(JSON.stringify(PRESETS[k])); }); });
  var battle = null, timer = null, speed = 1, pendingTarget = null;

  function $(id){ return document.getElementById(id); }
  function opt(value, text, sel){ return '<option value="' + value + '"' + (sel ? ' selected' : '') + '>' + text + '</option>'; }

  // ---------- setup ----------
  function renderTeam(side){
    var html = '<b class="p' + (side + 1) + '">Player ' + (side + 1) + '</b><table><tr><th>#</th><th>Preset</th>' +
      SLOTS.map(function(s){ return '<th>' + SLOT_LABEL[s] + '</th>'; }).join('') + '</tr>';
    teams[side].forEach(function(bot, i){
      html += '<tr><td>' + (i + 1) + (i === 0 ? '★' : '') + '</td><td><select data-preset="' + side + '-' + i + '">' + opt('', '—') +
        Object.keys(PRESETS).map(function(k){ return opt(k, PRESETS[k].name); }).join('') + '</select></td>';
      SLOTS.forEach(function(slot){
        html += '<td><select data-part="' + side + '-' + i + '-' + slot + '">' + Object.keys(PARTS).filter(function(k){ return PARTS[k].slot === slot; })
          .map(function(k){ return opt(k, PARTS[k].name, bot[slot] === k); }).join('') + '</select></td>';
      });
      html += '</tr>';
    });
    $('team' + side).innerHTML = html + '</table>';
  }
  function renderSetup(){
    renderTeam(0); renderTeam(1);
    $('terrain').innerHTML = Object.keys(TERRAINS).map(function(k){ return opt(k, TERRAINS[k].name); }).join('');
    // one column per stat; hover a header for its meaning (also listed under the table)
    var info = {};
    STAT_INFO.forEach(function(r){ info[r[0]] = r; });
    var actionCols = ['hp', 'action', 'type', 'success', 'power', 'charge', 'cooldown', 'uses'];
    var legCols = ['hp', 'legType', 'propulsion', 'evasion', 'defense'];
    function head(cols){ return '<tr><th>Set</th><th>Slot</th><th>Part</th>' + cols.map(function(c){ return '<th title="' + info[c][2].replace(/"/g, '&quot;') + '">' + info[c][1] + '</th>'; }).join('') + '</tr>'; }
    function rows(filter, cols){
      return Object.keys(PARTS).filter(function(k){ return filter(PARTS[k]); }).map(function(k){
        var d = PARTS[k];
        return '<tr><td>' + d.set + '</td><td>' + SLOT_LABEL[d.slot] + '</td><td>' + d.name + '</td>' +
          cols.map(function(c){ var v = d[c]; return '<td class="' + (typeof v === 'number' ? 'num' : '') + '">' + (v == null ? '—' : v) + '</td>'; }).join('') + '</tr>';
      }).join('');
    }
    var terrainRows = Object.keys(TERRAINS).map(function(t){
      return '<tr><td>' + TERRAINS[t].name + '</td>' + LEG_TYPES.map(function(l){ var m = TERRAINS[t].mods[l] || [1, 1]; return '<td class="num">' + m[0] + ' / ' + m[1] + '</td>'; }).join('') + '</tr>';
    }).join('');
    $('partsTable').innerHTML =
      '<b>Heads &amp; arms</b><table>' + head(actionCols) + rows(function(d){ return d.slot !== 'legs'; }, actionCols) + '</table><br>' +
      '<b>Legs</b><table>' + head(legCols) + rows(function(d){ return d.slot === 'legs'; }, legCols) + '</table>' +
      '<h2>What the stats mean</h2><table>' + STAT_INFO.map(function(r){ return '<tr><th>' + r[1] + '</th><td>' + r[2] + '</td></tr>'; }).join('') + '</table>' +
      '<h2>Attack types</h2><table>' + Object.keys(ATTACK_TYPES).map(function(k){ return '<tr><th>' + ATTACK_TYPES[k].label + '</th><td>' + ATTACK_TYPES[k].text + '</td></tr>'; }).join('') + '</table>' +
      '<h2>Terrain <small>(propulsion × / evasion × per leg type)</small></h2><table><tr><th></th>' + LEG_TYPES.map(function(l){ return '<th>' + l + '</th>'; }).join('') + '</tr>' + terrainRows + '</table>';
  }
  document.addEventListener('change', function(e){
    var t = e.target, d;
    if ((d = t.getAttribute('data-preset')) && t.value){ var p = d.split('-'); teams[p[0]][p[1]] = JSON.parse(JSON.stringify(PRESETS[t.value])); renderTeam(+p[0]); }
    if ((d = t.getAttribute('data-part'))){ var q = d.split('-'); teams[q[0]][q[1]][q[2]] = t.value; }
  });

  // ---------- battle ----------
  $('startBtn').addEventListener('click', function(){
    battle = createBattle(teams, $('terrain').value);
    $('setup').classList.add('hidden'); $('battle').classList.remove('hidden');
    $('terrainLabel').textContent = '· ' + TERRAINS[battle.terrain].name;
    run();
  });
  $('quitBtn').addEventListener('click', function(){ stop(); battle = null; $('battle').classList.add('hidden'); $('setup').classList.remove('hidden'); });
  $('speedBtn').addEventListener('click', function(){ speed = speed === 1 ? 3 : speed === 3 ? 10 : 1; $('speedBtn').textContent = 'Speed: ' + speed + '×'; });

  var waitingFor = null;   // the event the player has to deal with
  function stop(){ if (timer){ clearInterval(timer); timer = null; } }
  function run(){
    stop();
    waitingFor = null;
    timer = setInterval(function(){
      for (var i = 0; i < speed; i++){
        var ev = stepOnce(battle);
        if (ev){ stop(); waitingFor = ev; break; }
      }
      render();
    }, 40);
  }

  function renderCmd(){
    var c = $('cmd'), ev = waitingFor;
    if (!ev){ c.innerHTML = '<i>Running… (tick ' + battle.tick + ')</i>'; return; }
    if (ev.type === 'end'){
      c.innerHTML = '<b>' + (battle.winner === 'draw' ? 'Draw.' : 'Player ' + (battle.winner + 1) + ' wins!') + '</b>';
      return;
    }
    if (ev.type === 'action'){
      c.innerHTML = battle.log.slice(ev.from).map(function(l){ return '<div class="' + l.kind + '">' + l.text + '</div>'; }).join('') +
        '<button id="contBtn"><b>Continue</b> (space)</button>';
      $('contBtn').addEventListener('click', run);
      return;
    }
    // order: pick a part, then a target if it needs one
    var bot = ev.bot;
    var html = '<div class="p' + (bot.side + 1) + '"><b>P' + (bot.side + 1) + ' ' + bot.name + '</b> — choose an action:</div>';
    if (!pendingTarget){
      html += '<table><tr><th></th><th>Part</th><th>Action</th><th>Type</th><th>Success</th><th>Power</th><th>Charge</th><th>Cooldown</th><th>Uses left</th></tr>';
      usableSlots(bot).forEach(function(slot){
        var p = bot.parts[slot], d = p.def;
        html += '<tr><td><button data-slot="' + slot + '">Use</button></td><td>' + SLOT_LABEL[slot] + ': <b>' + d.name + '</b></td><td>' + d.action + '</td><td>' + (d.type || '—') + '</td>' +
          [d.success, d.power, d.charge, d.cooldown].map(function(v){ return '<td class="num">' + v + '</td>'; }).join('') + '<td class="num">' + (p.uses == null ? '—' : p.uses) + '</td></tr>';
      });
      html += '</table>';
    } else {
      var def = bot.parts[pendingTarget].def;
      var targets = def.action === 'repair' ? battle.teams[bot.side] : battle.teams[1 - bot.side];
      html += '<div>' + def.name + ' → target:</div>';
      targets.forEach(function(t, i){ if (t.state !== 'out') html += '<button data-target="' + i + '">' + t.name + (t.leader ? ' ★' : '') + '</button>'; });
      html += '<button data-back="1">← back</button>';
    }
    c.innerHTML = html;
    c.querySelectorAll('[data-slot]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var slot = btn.getAttribute('data-slot'), action = bot.parts[slot].def.action;
        if (action === 'shoot' || action === 'repair'){ pendingTarget = slot; renderCmd(); }
        else { giveOrder(battle, bot, slot); run(); }
      });
    });
    c.querySelectorAll('[data-target]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var def = bot.parts[pendingTarget].def;
        var team = def.action === 'repair' ? battle.teams[bot.side] : battle.teams[1 - bot.side];
        giveOrder(battle, bot, pendingTarget, team[+btn.getAttribute('data-target')]);
        pendingTarget = null; run();
      });
    });
    c.querySelectorAll('[data-back]').forEach(function(btn){ btn.addEventListener('click', function(){ pendingTarget = null; renderCmd(); }); });
  }

  function stateText(bot){
    if (bot.state === 'out') return 'FUNCTION CEASED';
    if (bot.state === 'idle') return 'awaiting order';
    if (bot.state === 'stuck') return 'no usable parts';
    var part = bot.order ? bot.parts[bot.order.slot].def.name : '';
    return { charge: '→ ' + part, act: '! ' + part, guard: 'GUARDING (' + bot.guardLeft + ')', cool: '← ' + part }[bot.state];
  }

  function render(){
    if (!battle) return;
    var lanes = '';
    for (var i = 0; i < 3; i++){
      lanes += '<div class="lane"><div class="center"></div>';
      [0, 1].forEach(function(s){
        var bot = battle.teams[s][i];
        if (!bot) return;
        var x = s === 0 ? 8 + bot.pos * 0.42 : 92 - bot.pos * 0.42;   // percent across the field
        lanes += '<div class="marker p' + (s + 1) + ' ' + bot.state + '" style="left:' + x + '%">' + bot.name + (bot.leader ? ' ★' : '') + '<br><small>' + stateText(bot) + '</small></div>';
      });
      lanes += '</div>';
    }
    $('field').innerHTML = lanes;
    [0, 1].forEach(function(s){
      var html = '<b class="p' + (s + 1) + '">Player ' + (s + 1) + '</b><table>';
      battle.teams[s].forEach(function(bot){
        html += '<tr><th colspan="3" class="' + (bot.state === 'out' ? 'dead' : '') + '">' + bot.name + (bot.leader ? ' ★' : '') + '</th></tr>';
        SLOTS.forEach(function(slot){
          var p = bot.parts[slot], pct = p.hp / p.max;
          html += '<tr class="' + (p.hp ? '' : 'dead') + '"><td>' + SLOT_LABEL[slot] + '</td><td>' + p.def.name + (p.uses != null ? ' ×' + p.uses : '') + '</td>' +
            '<td class="num"><span class="bar' + (pct < 0.34 ? ' low' : '') + '"><div style="width:' + pct * 100 + '%"></div></span> ' + p.hp + '/' + p.max + '</td></tr>';
        });
      });
      $('teamStatus' + s).innerHTML = html + '</table>';
    });
    var logEl = $('log');
    logEl.innerHTML = battle.log.map(function(l){ return '<div class="' + l.kind + '">t' + l.tick + ' ' + l.text + '</div>'; }).join('');
    logEl.scrollTop = logEl.scrollHeight;
    renderCmd();
  }

  document.addEventListener('keydown', function(e){
    if (e.code === 'Space' && waitingFor && waitingFor.type === 'action'){ e.preventDefault(); run(); }
  });

  renderSetup();
})();
</script>
</body>
</html>
